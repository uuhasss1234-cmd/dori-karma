 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دوري الكرمة - الدرجة الأولى</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="دوري الكرمة" />
  <style>
    :root {
      --blue-900: #1e3a8a;
      --blue-800: #1e40af;
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;
      --white: #ffffff;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --green-600: #16a34a;
      --amber-500: #f59e0b;
      --red-600: #dc2626;
      --shadow: 0 4px 16px rgba(29, 78, 216, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Naskh Arabic", Tahoma, sans-serif;
      background: linear-gradient(180deg, var(--blue-50) 0%, var(--white) 240px);
      color: var(--slate-800);
      min-height: 100vh;
      padding-bottom: 84px;
    }
    .app-header {
      background: linear-gradient(135deg, var(--blue-900), var(--blue-700));
      color: var(--white);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 12px rgba(30, 58, 138, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .header-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--white);
      padding: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .header-titles h1 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 800;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-titles p {
      margin: 2px 0 0;
      font-size: 0.72rem;
      color: var(--blue-100);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .sync-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: var(--white);
      white-space: nowrap;
    }
    .role-btn {
      border: 1.5px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.14);
      color: var(--white);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }
    .role-btn.admin-active {
      background: var(--white);
      color: var(--blue-800);
      border-color: var(--white);
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px;
    }
    .hero-card {
      background: var(--white);
      border: 1px solid var(--blue-100);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 14px;
    }
    .emblem-wrap {
      width: 118px;
      height: 118px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: var(--white);
      border: 3px solid var(--blue-700);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(29, 78, 216, 0.14);
      overflow: hidden;
    }
    .hero-committee {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--blue-800);
      margin: 0 0 4px;
    }
    .hero-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--blue-900);
      margin: 0 0 6px;
    }
    .hero-sub {
      font-size: 0.85rem;
      color: var(--slate-600);
      margin: 0 0 14px;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    @media (min-width: 640px) {
      .quick-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .quick-tile {
      background: var(--blue-50);
      border: 1px solid var(--blue-100);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .quick-tile:active { transform: scale(0.98); }
    .quick-tile strong {
      display: block;
      color: var(--blue-800);
      font-size: 0.92rem;
      margin-bottom: 2px;
    }
    .quick-tile span {
      font-size: 0.75rem;
      color: var(--slate-600);
    }
    .section-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--blue-900);
    }
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--slate-200);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: var(--white);
    }
    th {
      background: var(--blue-800);
      color: var(--white);
      padding: 9px 7px;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
    }
    th.team-col, td.team-col {
      text-align: right;
      padding-right: 10px;
      white-space: nowrap;
    }
    td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--slate-100);
      text-align: center;
      font-weight: 600;
    }
    tr:nth-child(even) td { background: var(--blue-50); }
    .pts-cell { color: var(--blue-800); font-weight: 900; }
    .round-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: thin;
    }
    .round-pill {
      border: 1px solid var(--blue-200, #bfdbfe);
      background: var(--blue-50);
      color: var(--blue-800);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .round-pill.active {
      background: var(--blue-700);
      color: var(--white);
      border-color: var(--blue-700);
    }
    .match-card {
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 10px;
      background: var(--white);
    }
    .match-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .team-home { text-align: right; color: var(--slate-800); }
    .team-away { text-align: left; color: var(--slate-800); }
    .score-box {
      background: var(--blue-50);
      border: 1px solid var(--blue-100);
      color: var(--blue-900);
      border-radius: 10px;
      padding: 5px 11px;
      font-weight: 900;
      font-size: 0.95rem;
      min-width: 72px;
      text-align: center;
    }
    .match-meta {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--slate-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.76rem;
      color: var(--slate-600);
    }
    .btn-sm {
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--blue-700);
      color: var(--white);
    }
    .btn-outline {
      border: 1px solid var(--blue-700);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--white);
      color: var(--blue-700);
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 1px solid var(--slate-200);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 30;
      box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.06);
    }
    .nav-item {
      border: none;
      background: transparent;
      padding: 9px 4px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--slate-600);
      cursor: pointer;
    }
    .nav-item.active {
      color: var(--blue-700);
      background: var(--blue-50);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--white);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.25);
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-row { margin-bottom: 10px; }
    .form-row label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; color: var(--slate-800); }
    .form-row input, .form-row select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--slate-200);
      font-size: 0.86rem;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pill-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--blue-50);
      color: var(--blue-800);
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <div class="header-logo">
