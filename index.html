  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دوري الكرمة - الدرجة الأولى</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="دوري الكرمة" />
  <style>
    :root {
      --blue-900: #1e3a8a;
      --blue-800: #1e40af;
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;
      --white: #ffffff;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --green-600: #16a34a;
      --amber-500: #f59e0b;
      --red-600: #dc2626;
      --shadow: 0 4px 16px rgba(29, 78, 216, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Naskh Arabic", Tahoma, sans-serif;
      background: linear-gradient(180deg, var(--blue-50) 0%, var(--white) 240px);
      color: var(--slate-800);
      min-height: 100vh;
      padding-bottom: 88px;
    }
    .app-header {
      background: linear-gradient(135deg, var(--blue-900), var(--blue-700));
      color: var(--white);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 12px rgba(30, 58, 138, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .header-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--white);
      padding: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .header-titles h1 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 800;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-titles p {
      margin: 2px 0 0;
      font-size: 0.72rem;
      color: var(--blue-100);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .sync-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: var(--white);
      white-space: nowrap;
      cursor: pointer;
    }
    .role-btn {
      border: 1.5px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.14);
      color: var(--white);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }
    .role-btn.admin-active {
      background: var(--white);
      color: var(--blue-800);
      border-color: var(--white);
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
    }
    .hero-card {
      background: var(--white);
      border: 1px solid var(--blue-100);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 14px;
    }
    .emblem-wrap {
      width: 118px;
      height: 118px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: var(--white);
      border: 3px solid var(--blue-700);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(29, 78, 216, 0.14);
      overflow: hidden;
    }
    .hero-committee {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--blue-800);
      margin: 0 0 4px;
    }
    .hero-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--blue-900);
      margin: 0 0 6px;
    }
    .hero-sub {
      font-size: 0.85rem;
      color: var(--slate-600);
      margin: 0 0 14px;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    @media (min-width: 640px) {
      .quick-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .quick-tile {
      background: var(--blue-50);
      border: 1px solid var(--blue-100);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .quick-tile:active { transform: scale(0.98); }
    .quick-tile strong {
      display: block;
      color: var(--blue-800);
      font-size: 0.92rem;
      margin-bottom: 2px;
    }
    .quick-tile span {
      font-size: 0.75rem;
      color: var(--slate-600);
    }
    .section-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--blue-900);
    }
    .head-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--slate-200);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: var(--white);
    }
    th {
      background: var(--blue-800);
      color: var(--white);
      padding: 9px 7px;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
    }
    th.team-col, td.team-col {
      text-align: right;
      padding-right: 10px;
      white-space: nowrap;
    }
    td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--slate-100);
      text-align: center;
      font-weight: 600;
    }
    tr:nth-child(even) td { background: var(--blue-50); }
    .pts-cell { color: var(--blue-800); font-weight: 900; }
    .team-link-btn {
      background: none;
      border: none;
      padding: 0;
          <section id="tab-rounds" class="tab-panel" style="display:none;">
      <div class="section-card">
        <div class="section-head">
          <h2 id="roundHeading">الجولة 1</h2>
          <div class="head-actions">
            <span class="pill-badge" id="byeTeamBadge"></span>
            <button class="btn-sm" onclick="shareCurrentRound()">مشاركة الجولة</button>
          </div>
        </div>
        <div class="round-pills" id="roundPills"></div>
        <div id="roundMatchesList"></div>
      </div>
    </section>

    <section id="tab-teams" class="tab-panel" style="display:none;">
      <div class="section-card">
        <div class="section-head">
          <h2>فرق البطولة (13 فريقاً)</h2>
          <span class="pill-badge">اضغط على فريق لعرض التفاصيل</span>
        </div>
        <div id="teamsCardsGrid" class="teams-grid"></div>
      </div>

      <div class="section-card" id="selectedTeamPanel">
        <div class="section-head">
          <h2 id="selectedTeamTitle">تفاصيل الفريق</h2>
          <div class="head-actions">
            <button id="editCoachBtn" class="btn-outline" style="display:none;" onclick="openCoachModal()">تعديل المدرب</button>
          </div>
        </div>
        <div id="selectedTeamDetails"></div>
      </div>
    </section>

    <section id="tab-stats" class="tab-panel" style="display:none;">
      <div class="section-card">
        <div class="section-head">
          <h2>قائمة الهدافين</h2>
          <button id="addScorerBtn" class="btn-sm" style="display:none;" onclick="openScorerModal()">+ إضافة هدف</button>
        </div>
        <div id="scorersList"></div>
      </div>

      <div class="section-card">
        <div class="section-head">
          <h2>البطاقات الصفراء والحمراء حسب اللاعبين</h2>
          <button id="addPlayerCardBtn" class="btn-sm" style="display:none;" onclick="openPlayerCardModal()">+ تسجيل بطاقة لاعب</button>
        </div>
        <div id="playerCardsList"></div>
      </div>

      <div class="section-card">
        <div class="section-head">
          <h2>البطاقات الصفراء والحمراء حسب الفرق</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th class="team-col">الفريق</th>
                <th>بطاقات صفراء</th>
                <th>بطاقات حمراء</th>
              </tr>
            </thead>
            <tbody id="cardsBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">الرئيسية</button>
    <button class="nav-item" data-tab="standings" onclick="switchTab('standings')">الترتيب</button>
    <button class="nav-item" data-tab="rounds" onclick="switchTab('rounds')">الجولات</button>
    <button class="nav-item" data-tab="teams" onclick="switchTab('teams')">الفرق</button>
    <button class="nav-item" data-tab="stats" onclick="switchTab('stats')">الإحصائيات</button>
  </nav>

  <div id="pinModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 style="margin:0 0 10px;color:var(--blue-900);">دخول وضع المشرف</h3>
      <form onsubmit="submitPin(event)">
        <div class="form-row">
          <label for="pinInput">رمز الدخول</label>
          <input id="pinInput" type="password" autocomplete="off" required />
        </div>
        <div id="pinError" style="color:var(--red-600);font-size:0.78rem;margin-bottom:8px;display:none;">الرمز غير صحيح</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" class="btn-outline" onclick="closeModal('pinModal')">إلغاء</button>
          <button type="submit" class="btn-sm">دخول</button>
        </div>
      </form>
    </div>
  </div>

  <div id="matchModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 id="matchModalTitle" style="margin:0 0 12px;color:var(--blue-900);">تعديل المباراة</h3>
      <form onsubmit="saveMatchEdit(event)">
        <div class="grid-2">
          <div class="form-row">
            <label id="homeScoreLabel" for="homeScoreInput">أهداف المضيف</label>
            <input id="homeScoreInput" type="number" min="0" max="99" />
          </div>
          <div class="form-row">
            <label id="awayScoreLabel" for="awayScoreInput">أهداف الضيف</label>
            <input id="awayScoreInput" type="number" min="0" max="99" />
          </div>
        </div>
        <div class="grid-2">
          <div class="form-row">
            <label id="homeYellowLabel" for="homeYellowInput">صفراء المضيف</label>
            <input id="homeYellowInput" type="number" min="0" max="20" value="0" />
          </div>
          <div class="form-row">
            <label id="awayYellowLabel" for="awayYellowInput">صفراء الضيف</label>
            <input id="awayYellowInput" type="number" min="0" max="20" value="0" />
          </div>
        </div>
        <div class="grid-2">
          <div class="form-row">
            <label id="homeRedLabel" for="homeRedInput">حمراء المضيف</label>
            <input id="homeRedInput" type="number" min="0" max="10" value="0" />
          </div>
          <div class="form-row">
            <label id="awayRedLabel" for="awayRedInput">حمراء الضيف</label>
            <input id="awayRedInput" type="number" min="0" max="10" value="0" />
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
          <button type="button" class="btn-outline" onclick="closeModal('matchModal')">إلغاء</button>
          <button type="submit" class="btn-sm">حفظ النتيجة</button>
        </div>
      </form>
    </div>
  </div>

  <div id="scorerModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 style="margin:0 0 12px;color:var(--blue-900);">إضافة هدف للاعب</h3>
      <form onsubmit="saveScorer(event)">
        <div class="form-row">
          <label for="scorerNameInput">اسم اللاعب</label>
          <input id="scorerNameInput" type="text" required />
        </div>
        <div class="form-row">
          <label for="scorerTeamSelect">الفريق</label>
          <select id="scorerTeamSelect"></select>
        </div>
        <div class="form-row">
          <label for="scorerGoalsInput">عدد الأهداف</label>
          <input id="scorerGoalsInput" type="number" min="1" max="50" value="1" required />
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" class="btn-outline" onclick="closeModal('scorerModal')">إلغاء</button>
          <button type="submit" class="btn-sm">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <div id="coachModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 id="coachModalTitle" style="margin:0 0 12px;color:var(--blue-900);">تعديل مدرب الفريق</h3>
      <form onsubmit="saveCoach(event)">
        <div class="form-row">
          <label for="coachNameInput">اسم المدرب</label>
          <input id="coachNameInput" type="text" placeholder="أدخل اسم المدرب" />
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" class="btn-outline" onclick="closeModal('coachModal')">إلغاء</button>
          <button type="submit" class="btn-sm">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <div id="playerCardModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 style="margin:0 0 12px;color:var(--blue-900);">تسجيل بطاقة للاعب</h3>
      <form onsubmit="savePlayerCard(event)">
        <div class="form-row">
          <label for="cardPlayerNameInput">اسم اللاعب</label>
          <input id="cardPlayerNameInput" type="text" required />
        </div>
        <div class="form-row">
          <label for="cardTeamSelect">الفريق</label>
          <select id="cardTeamSelect"></select>
        </div>
        <div class="grid-2">
          <div class="form-row">
            <label for="cardYellowInput">بطاقات صفراء</label>
            <input id="cardYellowInput" type="number" min="0" max="10" value="1" />
          </div>
          <div class="form-row">
            <label for="cardRedInput">بطاقات حمراء</label>
            <input id="cardRedInput" type="number" min="0" max="5" value="0" />
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" class="btn-outline" onclick="closeModal('playerCardModal')">إلغاء</button>
          <button type="submit" class="btn-sm">حفظ البطاقة</button>
        </div>
      </form>
    </div>
  </div>

  <div id="shareModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 id="shareModalTitle" style="margin:0 0 10px;color:var(--blue-900);">مشاركة النص</h3>
      <div class="form-row">
        <textarea id="shareTextArea" rows="9" readonly></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="btn-outline" onclick="closeModal('shareModal')">إغلاق</button>
        <button type="button" class="btn-sm" onclick="copyShareText()">نسخ النص</button>
      </div>
    </div>
  </div>

    function buildDefaultTeamsInfo() {
      const info = {};
      for (const name of TEAMS) info[name] = { coach: "غير محدد" };
      return info;
    }

    function sanitizeTeamsInfo(rawInfo) {
      const base = buildDefaultTeamsInfo();
      if (!rawInfo || typeof rawInfo !== "object") return base;
      for (const name of TEAMS) {
        const entry = rawInfo[name];
        if (entry && typeof entry === "object") {
          base[name].coach = typeof entry.coach === "string" && entry.coach.trim() ? entry.coach.trim() : "غير محدد";
        }
      }
      return base;
    }

    function sanitizePlayerCards(rawCards) {
      if (!Array.isArray(rawCards)) return [];
      return rawCards
        .filter(c => c && typeof c.name === "string" && c.name.trim() && TEAMS.includes(c.team))
        .map(c => ({
          name: c.name.trim(),
          team: c.team,
          yellow: Math.max(0, Math.floor(Number(c.yellow) || 0)),
          red: Math.max(0, Math.floor(Number(c.red) || 0))
        }))
        .filter(c => c.yellow > 0 || c.red > 0);
    }

    function sanitizeMatch(m) {
      const hs = (m && m.hScore !== null && m.hScore !== undefined && m.hScore !== "" && Number.isFinite(Number(m.hScore)))
        ? Math.max(0, Math.floor(Number(m.hScore))) : null;
      const as = (m && m.aScore !== null && m.aScore !== undefined && m.aScore !== "" && Number.isFinite(Number(m.aScore)))
        ? Math.max(0, Math.floor(Number(m.aScore))) : null;
      return {
        home: m.home,
        away: m.away,
        hScore: hs,
        aScore: as,
        hY: Math.max(0, Math.floor(Number(m && m.hY) || 0)),
        aY: Math.max(0, Math.floor(Number(m && m.aY) || 0)),
        hR: Math.max(0, Math.floor(Number(m && m.hR) || 0)),
        aR: Math.max(0, Math.floor(Number(m && m.aR) || 0))
      };
    }

    function sanitizeRounds(roundsInput) {
      if (!Array.isArray(roundsInput) || roundsInput.length !== 13) return null;
      return roundsInput.map((r, idx) => {
        const rNum = Number(r && r.round) || (idx + 1);
        const byeTeam = r && r.bye ? r.bye : TEAMS[idx % TEAMS.length];
        const rawMatches = Array.isArray(r && r.matches) ? r.matches.map(sanitizeMatch) : [];
        return {
          round: rNum,
          bye: byeTeam,
          matches: rNum >= 6 ? [] : rawMatches
        };
      });
    }

    function buildRemainingRounds() {
      const rounds = INITIAL_ROUNDS.map(r => ({
        round: r.round,
        bye: r.bye,
        matches: r.matches.map(sanitizeMatch)
      }));
      for (let rNum = 6; rNum <= 13; rNum++) {
        const byeTeam = TEAMS[(rNum - 1) % TEAMS.length];
        rounds.push({ round: rNum, bye: byeTeam, matches: [] });
      }
      return rounds;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const cleanRounds = sanitizeRounds(parsed && parsed.rounds);
          if (cleanRounds) {
            return {
              isAdmin: false,
              selectedRound: 5,
              selectedTeam: TEAMS[0],
              rounds: cleanRounds,
              scorers: Array.isArray(parsed.scorers) ? parsed.scorers : [],
              teamsInfo: sanitizeTeamsInfo(parsed.teamsInfo),
              playerCards: sanitizePlayerCards(parsed.playerCards),
              updatedAt: Number(parsed.updatedAt) || 0
            };
          }
        }
      } catch (e) {}
      return {
        isAdmin: false,
        selectedRound: 5,
        selectedTeam: TEAMS[0],
        rounds: buildRemainingRounds(),
        scorers: [],
        teamsInfo: buildDefaultTeamsInfo(),
        playerCards: [],
        updatedAt: 0
      };
    }

    const state = loadState();
    let editingMatchRef = null;

    function setSyncBadge(text) {
      const el = document.getElementById("syncStatusBadge");
      if (el) el.textContent = text;
    }

    function getSerializablePayload() {
      const ts = Date.now();
      state.updatedAt = ts;
      return {
        rounds: state.rounds,
        scorers: state.scorers,
        teamsInfo: state.teamsInfo,
        playerCards: state.playerCards,
        updatedAt: ts
      };
    }

    async function pushToCloud() {
      setSyncBadge("جاري الحفظ...");
      try {
        const res = await fetch(FIREBASE_DB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(getSerializablePayload())
        });
        setSyncBadge(res.ok ? "مباشر ✓" : "تنبيه حفظ");
      } catch (e) {
        setSyncBadge("بدون اتصال");
      }
    }

    async function syncFromCloud(manual = false) {
      if (manual) setSyncBadge("تحديث...");
      try {
        const res = await fetch(FIREBASE_DB_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) { setSyncBadge("مزامنة"); return; }
        const data = await res.json();
        const cleanRounds = sanitizeRounds(data && data.rounds);
        const cloudTs = Number(data && data.updatedAt) || 0;
        const localTs = Number(state.updatedAt) || 0;

        if (cleanRounds && (manual || cloudTs >= localTs || localTs === 0)) {
          state.rounds = cleanRounds;
          state.scorers = Array.isArray(data.scorers) ? data.scorers : [];
          state.teamsInfo = sanitizeTeamsInfo(data.teamsInfo);
          state.playerCards = sanitizePlayerCards(data.playerCards);
          state.updatedAt = cloudTs || Date.now();
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              rounds: state.rounds, scorers: state.scorers, teamsInfo: state.teamsInfo, playerCards: state.playerCards, updatedAt: state.updatedAt
            }));
          } catch (e) {}
          setSyncBadge("مباشر ✓");
          renderAll();
        } else if (cleanRounds && localTs > cloudTs) {
          await pushToCloud();
        } else {
          await pushToCloud();
        }
      } catch (e) {
        setSyncBadge("محلي");
      }
    }

    function saveState() {
      const payload = getSerializablePayload();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {}
      pushToCloud();
    }
    function computeStandings() {
      const map = {};
      for (const name of TEAMS) {
        map[name] = { team: name, played: 0, win: 0, draw: 0, loss: 0, gf: 0, ga: 0, gd: 0, pts: 0, yellow: 0, red: 0 };
      }
      let playedMatchesCount = 0;
      for (const r of state.rounds) {
        for (const m of r.matches) {
          const h = map[m.home];
          const a = map[m.away];
          if (!h || !a) continue;
          h.yellow += Number(m.hY) || 0;
          a.yellow += Number(m.aY) || 0;
          h.red += Number(m.hR) || 0;
          a.red += Number(m.aR) || 0;
          if (m.hScore !== null && m.aScore !== null && m.hScore !== "" && m.aScore !== "") {
            const hs = Number(m.hScore);
            const as = Number(m.aScore);
            if (Number.isFinite(hs) && Number.isFinite(as)) {
              playedMatchesCount++;
              h.played++; a.played++;
              h.gf += hs; h.ga += as; a.gf += as; a.ga += hs;
              if (hs > as) { h.win++; h.pts += 3; a.loss++; }
              else if (as > hs) { a.win++; a.pts += 3; h.loss++; }
              else { h.draw++; a.draw++; h.pts += 1; a.pts += 1; }
            }
          }
        }
      }
      for (const c of state.playerCards) {
        if (map[c.team]) {
          map[c.team].yellow += Number(c.yellow) || 0;
          map[c.team].red += Number(c.red) || 0;
        }
      }
      const list = Object.values(map).map(row => {
        const gf = Number(row.gf) || 0;
        const ga = Number(row.ga) || 0;
        return { ...row, gf, ga, gd: gf - ga, pts: Number(row.pts) || 0 };
      });
      list.sort((x, y) => (y.pts - x.pts) || (y.gd - x.gd) || (y.gf - x.gf) || x.team.localeCompare(y.team, "ar"));
      return { list, playedMatchesCount };
    }

      m.aY = Math.max(0, Math.floor(Number(document.getElementById("awayYellowInput").value) || 0));

          const warnText = (c.red > 0 || c.yellow >= 2) ? ` <span class="card-badge-r">تنبيه إيقاف</span>` : "";
          const delBtn = state.isAdmin ? `<button class="btn-danger-sm" onclick="removePlayerCard(${idx})">حذف</button>` : "";
          return `<div class="player-item"><div><span>${c.name}</span><span style="color:var(--slate-600);font-size:0.78rem;"> (${c.team})</span>${warnText}</div><div style="display:flex;align-items:center;gap:6px;">${yBadge}${rBadge}${delBtn}</div></div>`;
        }).join("");
      }
      const cardsSorted = [...list].sort((a, b) => (b.red * 3 + b.yellow) - (a.red * 3 + a.yellow));
      document.getElementById("cardsBody").innerHTML = cardsSorted.map((r, i) => `<tr><td>${i + 1}</td><td class="team-col">${r.team}</td><td>${r.yellow}</td><td>${r.red}</td></tr>`).join("");
    }

    function selectRound(rNum) { state.selectedRound = rNum; renderAll(); }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let reg of regs) reg.unregister();
      });
    }

    renderAll();
    syncFromCloud(false);
  </script>
</body>
</html>
